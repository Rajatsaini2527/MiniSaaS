name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend — lint, test, build
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval db.adminCommand('ping')"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Lint
        working-directory: server
        run: npm run lint

      - name: Run tests
        working-directory: server
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/mini-saas-test
          MONGODB_TEST_URI: mongodb://localhost:27017/mini-saas-test
          JWT_ACCESS_SECRET: test_access_secret_at_least_32_chars!!
          JWT_REFRESH_SECRET: test_refresh_secret_at_least_32_chars!
          JWT_ACCESS_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d
          CORS_ORIGIN: http://localhost:3000
          REDIS_ENABLED: "false"
          LOG_LEVEL: error
        run: npm test

      - name: Verify server starts (syntax check)
        working-directory: server
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/mini-saas-ci
          JWT_ACCESS_SECRET: test_access_secret_at_least_32_chars!!
          JWT_REFRESH_SECRET: test_refresh_secret_at_least_32_chars!
          CORS_ORIGIN: http://localhost:3000
          REDIS_ENABLED: "false"
        run: node --check src/server.js && echo "✓ Syntax OK"

  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — typecheck, lint, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: TypeScript check
        working-directory: client
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Run tests
        working-directory: client
        run: npm test

      - name: Build
        working-directory: client
        env:
          VITE_API_URL: /api/v1
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: client/dist/
          retention-days: 7
